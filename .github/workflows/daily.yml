name: Daily faceless videos (1 long + 2 Shorts)

# Daily cadence (see README.md "Daily cadence" and "Peak-time publishing"):
# - This workflow runs at 12:00 UTC daily = 06:00 CST / 07:00 CDT Chicago,
#   so rendering finishes in the MORNING, well before the peak windows.
# - One run produces BOTH formats for one niche: 1 long-form video
#   (16:9, 1920x1080, 8-12 min, from the #1 topic) + 2 Shorts
#   (1080x1920, 30-60s, from topics #2 and #3). Log lines name each
#   output: "1 long + 2 Shorts". Defaults are capped at 1 + 2 — more
#   than that risks spam and a quality drop, so do not raise them here
#   without a reason (config: long_videos_per_day, shorts_per_day).
# - Every output passes the QA gate (src/qa.py) before review; a QA
#   failure fails the run and prevents the output entering the queue.
# - This workflow NEVER uploads to YouTube. It renders, runs QA, and
#   writes the human review queue only. Public publication is manual.
# - Peak-time scheduling is disabled for this workflow; no unattended
#   publication can occur after a workflow run.
on:
  schedule:
    - cron: "0 12 * * *"  # 12:00 UTC daily — morning render, before peak
  workflow_dispatch:
    inputs:
      niche:
        description: "Niche to create videos for (empty = top-ranked niche with data)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Run pipeline (render and review only)
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          NICHE_INPUT: ${{ inputs.niche }}
        run: |
          # Pass the workflow input through the environment, not by
          # interpolating untrusted text into shell source.
          NICHE_ARGS=()
          if [[ -n "$NICHE_INPUT" ]]; then
            NICHE_ARGS+=(--niche "$NICHE_INPUT")
          fi
          # Production workflow is render/review only. Publishing is a
          # separate human action after evidence and review-queue approval.
          python -m src.run "${NICHE_ARGS[@]}"
      - name: Preserve rendered videos and review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-scan-production-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            data/videos_long/**
            data/videos_short/**
            data/review_queue.md
            data/review_packet.md
            data/review_packet.json
            data/review_packets/**
            data/production_gate.json
            data/research_sources*.json
            data/research_sources_archived*.json
            data/evidence_ledger.json
            data/verification_report.json
            data/scripts_long.json
            data/scripts_shorts.json
            data/seo.json
            data/qa_report*.json
            data/metadata_qa.json
            data/compare.md
            data/run_log.json
            data/job_state.json
            data/series_state.json
            data/generated_visuals/**
            data/thumbnails/**
            data/thumbnails.json
