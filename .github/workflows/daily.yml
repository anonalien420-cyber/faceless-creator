name: Daily faceless videos (1 long + 2 Shorts)

# Daily cadence (see README.md "Daily cadence" and "Peak-time publishing"):
# - This workflow runs at 12:00 UTC daily = 06:00 CST / 07:00 CDT Chicago,
#   so rendering finishes in the MORNING, well before the peak windows.
# - One run produces BOTH formats for one niche: 1 long-form video
#   (16:9, 1920x1080, 8-12 min, from the #1 topic) + 2 Shorts
#   (1080x1920, 30-60s, from topics #2 and #3). Log lines name each
#   output: "1 long + 2 Shorts". Defaults are capped at 1 + 2 — more
#   than that risks spam and a quality drop, so do not raise them here
#   without a reason (config: long_videos_per_day, shorts_per_day).
# - Every output passes the QA gate (src/qa.py) before upload; a QA
#   failure fails the run and uploads NOTHING.
# - Upload (opt-in only, UPLOAD_ENABLED secret) uses --publish-at-peak:
#   each video uploads as private, then YouTube publishes it at its own
#   next peak window — Shorts midday + evening, long-form evening peak
#   (config peak_windows, per-format windows). One niche per run, never
#   every niche in one day. Every run also writes data/review_queue.md
#   (unlisted by default + human review before the peak window) and
#   data/seo.json; --auto-public stays OFF unless explicitly enabled.
# - Peak times are general audience windows, NOT a guarantee of popularity.
on:
  schedule:
    - cron: "0 12 * * *"  # 12:00 UTC daily — morning render, before peak
  workflow_dispatch:
    inputs:
      niche:
        description: "Niche to create videos for (empty = top-ranked niche with data)"
        required: false
        default: ""
      publish_at_peak:
        description: "Publish at the next peak window instead of staying unlisted"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Run pipeline (dry-run upload unless UPLOAD_ENABLED)
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          UPLOAD_ENABLED: ${{ secrets.UPLOAD_ENABLED }}
        run: |
          NICHE_ARG=""
          if [ -n "${{ inputs.niche }}" ]; then
            NICHE_ARG="--niche ${{ inputs.niche }}"
          fi
          PEAK_ARG=""
          if [ "${{ inputs.publish_at_peak }}" = "true" ]; then
            PEAK_ARG="--publish-at-peak"
          fi
          # With UPLOAD_ENABLED unset/false, src.upload dry-runs and
          # nothing is posted. Verify a local run end to end before
          # setting secrets.UPLOAD_ENABLED=true in the repo.
          if [ "$UPLOAD_ENABLED" = "true" ]; then
            python -m src.run $NICHE_ARG --upload $PEAK_ARG
          else
            python -m src.run $NICHE_ARG
          fi
