name: Daily faceless videos (1 long + 2 Shorts)

# Daily cadence (see README.md "Daily cadence" and "Peak-time publishing"):
# - This workflow runs at 12:00 UTC daily = 06:00 CST / 07:00 CDT Chicago,
#   so rendering finishes in the MORNING, well before the peak windows.
# - One run produces BOTH formats for one niche: 1 long-form video
#   (16:9, 1920x1080, 8-12 min, from the #1 topic) + 2 Shorts
#   (1080x1920, 30-60s, from topics #2 and #3). Defaults are capped at 1 + 2.
# - Every output passes the QA gate (src/qa.py) before upload; a QA
#   failure fails the run and uploads NOTHING.
# - Upload (opt-in only, UPLOAD_ENABLED secret) publishes at the next peak
#   window by default (Shorts midday + evening, long-form evening peak).
#   OAuth credentials are materialized from the YT_CLIENT_SECRETS / YT_TOKEN
#   secrets; without them an enabled upload fails loudly (no headless consent).
# - Every run uploads data/review_queue.md + QA reports + renders as a build
#   artifact so a human can review BEFORE the peak window. --auto-public
#   stays OFF unless explicitly enabled.
# - Peak times are general audience windows, NOT a guarantee of popularity.
on:
  schedule:
    - cron: "0 12 * * *"  # 12:00 UTC daily — morning render, before peak
  workflow_dispatch:
    inputs:
      niche:
        description: "Niche to create videos for (empty = top-ranked niche with data)"
        required: false
        default: ""
      publish_at_peak:
        description: "Publish at the next peak window instead of staying unlisted"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Run pipeline (dry-run upload unless UPLOAD_ENABLED)
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          UPLOAD_ENABLED: ${{ secrets.UPLOAD_ENABLED }}
          # Inputs are passed via env (never interpolated into the shell) to
          # avoid script injection, and quoted so multi-word niches work.
          NICHE_INPUT: ${{ inputs.niche }}
          PEAK_INPUT: ${{ inputs.publish_at_peak }}
          YT_CLIENT_SECRETS: ${{ secrets.YT_CLIENT_SECRETS }}
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
        run: |
          set -euo pipefail
          # Materialize OAuth credentials from secrets (these files are
          # gitignored and never committed).
          if [ -n "${YT_CLIENT_SECRETS:-}" ]; then printf '%s' "$YT_CLIENT_SECRETS" > client_secrets.json; fi
          if [ -n "${YT_TOKEN:-}" ]; then printf '%s' "$YT_TOKEN" > token.json; fi
          ARGS=()
          if [ -n "${NICHE_INPUT:-}" ]; then ARGS+=(--niche "$NICHE_INPUT"); fi
          if [ "${UPLOAD_ENABLED:-}" = "true" ]; then
            ARGS+=(--upload)
            # Scheduled runs have no input; default to peak publishing unless
            # the dispatch input explicitly disables it.
            if [ "${PEAK_INPUT:-true}" != "false" ]; then ARGS+=(--publish-at-peak); fi
          fi
          python -m src.run "${ARGS[@]}"
      - name: Upload review queue + reports + renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faceless-run-outputs
          retention-days: 7
          if-no-files-found: warn
          path: |
            data/review_queue.md
            data/run_log.json
            data/qa_report*.json
            data/seo.json
            data/compare.md
            data/niche_ranking.json
            data/niche_ranking.md
            data/thumbnails/
            data/videos_long/
            data/videos_short/
